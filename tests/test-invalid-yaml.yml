name: Test invalid YAML linting fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          yamllint_file_or_dir: tests/fixtures/invalid/bad.yaml
          yamllint_config_filepath: tests/fixtures/configs/default-relaxed.yaml

      - name: Assert action failed on invalid YAML
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.yamllint_output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "yamllint_output: '$OUTPUT'"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on invalid YAML"
          else
            echo "FAIL: expected action to fail on invalid YAML but got outcome '$OUTCOME'"
            exit 1
          fi
